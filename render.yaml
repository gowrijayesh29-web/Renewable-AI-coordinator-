services:
  - type: web
    name: renewable-ai-coordinator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SIM_MINUTES_PER_REAL_SECOND
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USE_SSL
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
